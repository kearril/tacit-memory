# Pushing a v* tag runs the checks on Linux, Windows and macOS, packages tacit self-contained for each platform on that
# platform's own runner, smoke-tests each package, attests where each package was built and creates one GitHub Release
# with every package and its SHA-256.
# Run by hand, it stops after the smoke tests and keeps the packages as workflow artifacts instead of creating a Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  package:
    needs: check
    strategy:
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          # macOS signs the executable only when it is built there, and Apple silicon runs no unsigned program.
          - runtime: osx-arm64
            os: macos-latest
          - runtime: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Package
        id: package
        # Forward slashes, so Git Bash on Windows reads the runner's temporary folder too.
        run: build/package.sh ${{ matrix.runtime }} "${RUNNER_TEMP//\\//}/release" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          # On a tag the package must carry the tag's version; by hand any version passes.
          expected=
          if [ "$GITHUB_REF_TYPE" = tag ]; then expected=${GITHUB_REF_NAME#v}; fi
          build/smoke.sh '${{ steps.package.outputs.folder }}' $expected

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tacit-${{ steps.package.outputs.version }}-${{ matrix.runtime }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

  # Only once every package has passed its smoke test, so a Release never holds some platforms and not others.
  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # The build provenance attestation signs with the workflow's OIDC identity and stores the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tacit-*
          merge-multiple: true
          path: packages

      # Lets anyone check that a package was built by this workflow from this repository:
      # gh attestation verify <package> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packages/*.zip
            packages/*.tar.gz

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          version=${tag#v}
          arguments=("$tag" packages/* --title "$version" --verify-tag)
          # The notes are the version's section of CHANGELOG.md, headed "## <version> - <date>"; a version without one gets none.
          notes=$RUNNER_TEMP/notes.md
          awk -v version="$version" '/^## / { if (found) exit; found = ($2 == version); next } found' CHANGELOG.md > "$notes"
          if [ -s "$notes" ]; then arguments+=(--notes-file "$notes"); else arguments+=(--notes ''); fi
          if [[ $version == *-* ]]; then arguments+=(--prerelease); fi
          gh release create "${arguments[@]}"

      - name: Update Homebrew tap and Scoop bucket
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          PACKAGE_REPOS_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PACKAGE_REPOS_TOKEN" ]; then
            echo "PACKAGE_REPOS_TOKEN is not set; skipping Homebrew/Scoop update."
            exit 0
          fi
          tag=$GITHUB_REF_NAME
          version=${tag#v}
          osx_sha=$(cut -d ' ' -f 1 "packages/tacit-${version}-osx-arm64.tar.gz.sha256")
          linux_sha=$(cut -d ' ' -f 1 "packages/tacit-${version}-linux-x64.tar.gz.sha256")
          win_sha=$(cut -d ' ' -f 1 "packages/tacit-${version}-win-x64.zip.sha256")

          work=$RUNNER_TEMP/package-repos
          mkdir -p "$work"

          git clone "https://x-access-token:${PACKAGE_REPOS_TOKEN}@github.com/kearril/homebrew-tap.git" "$work/homebrew-tap"
          mkdir -p "$work/homebrew-tap/Formula"
          cat <<EOF > "$work/homebrew-tap/Formula/tacit.rb"
          class Tacit < Formula
            desc "Local-first, transparent personal memory system for AI coding clients over MCP"
            homepage "https://github.com/kearril/tacit-memory"
            version "${version}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/kearril/tacit-memory/releases/download/${tag}/tacit-${version}-osx-arm64.tar.gz"
                sha256 "${osx_sha}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/kearril/tacit-memory/releases/download/${tag}/tacit-${version}-linux-x64.tar.gz"
                sha256 "${linux_sha}"
              end
            end

            def install
              libexec.install Dir["*"]
              bin.install_symlink libexec/"tacit"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/tacit --version")
            end
          end
          EOF
          (
            cd "$work/homebrew-tap"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Formula/tacit.rb
            if ! git diff --cached --quiet; then
              git commit -m "chore(tacit): update formula to ${version}"
              git push origin main
            fi
          )

          git clone "https://x-access-token:${PACKAGE_REPOS_TOKEN}@github.com/kearril/scoop-bucket.git" "$work/scoop-bucket"
          mkdir -p "$work/scoop-bucket/bucket"
          cat <<EOF > "$work/scoop-bucket/bucket/tacit.json"
          {
              "version": "${version}",
              "description": "Local-first, transparent personal memory system for AI coding clients over MCP.",
              "homepage": "https://github.com/kearril/tacit-memory",
              "license": "Apache-2.0",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/kearril/tacit-memory/releases/download/${tag}/tacit-${version}-win-x64.zip",
                      "hash": "${win_sha}"
                  }
              },
              "bin": "tacit.exe",
              "checkver": {
                  "github": "https://github.com/kearril/tacit-memory"
              },
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/kearril/tacit-memory/releases/download/v\$version/tacit-\$version-win-x64.zip",
                          "hash": {
                              "url": "\$url.sha256"
                          }
                      }
                  }
              }
          }
          EOF
          (
            cd "$work/scoop-bucket"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bucket/tacit.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(tacit): update manifest to ${version}"
              git push origin main
            fi
          )
