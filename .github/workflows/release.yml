# Pushing a v* tag runs the checks, packages tacit self-contained for win-x64, smoke-tests the package and creates the
# GitHub Release with the zip and its SHA-256. Run by hand, it stops after the smoke test and keeps the package as a
# workflow artifact instead of creating a Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  package:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Package
        id: package
        shell: pwsh
        run: |
          dotnet tool restore
          $package = ./build/package.ps1 -Output "$env:RUNNER_TEMP/release"
          "folder=$($package.Folder)" >> $env:GITHUB_OUTPUT
          "zip=$($package.Zip)" >> $env:GITHUB_OUTPUT
          "version=$($package.Version)" >> $env:GITHUB_OUTPUT

      - name: Smoke test
        shell: pwsh
        run: |
          # On a tag the package must carry the tag's version; by hand any version passes.
          $expected = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { '' }
          ./build/smoke.ps1 -PublishDir '${{ steps.package.outputs.folder }}' -ExpectedVersion $expected

      - uses: actions/upload-artifact@v7
        with:
          name: tacit-${{ steps.package.outputs.version }}-win-x64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256

      - name: Create the Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = '${{ steps.package.outputs.version }}'
          $zip = '${{ steps.package.outputs.zip }}'
          # A version's notes are optional: .github/release-notes/<tag>.md when it exists, otherwise none.
          $notes = ".github/release-notes/$tag.md"
          $arguments = @($tag, $zip, "$zip.sha256", '--title', $version, '--verify-tag')
          $arguments += if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--notes', '') }
          if ($version.Contains('-')) { $arguments += '--prerelease' }
          gh release create @arguments
