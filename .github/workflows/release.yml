# Pushing a v* tag runs the checks on Linux, Windows and macOS, packages tacit self-contained for each platform on that
# platform's own runner, smoke-tests each package, attests where each package was built and creates one GitHub Release
# with every package and its SHA-256.
# Run by hand, it stops after the smoke tests and keeps the packages as workflow artifacts instead of creating a Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  package:
    needs: check
    strategy:
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          # macOS signs the executable only when it is built there, and Apple silicon runs no unsigned program.
          - runtime: osx-arm64
            os: macos-latest
          - runtime: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Package
        id: package
        # Forward slashes, so Git Bash on Windows reads the runner's temporary folder too.
        run: build/package.sh ${{ matrix.runtime }} "${RUNNER_TEMP//\\//}/release" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          # On a tag the package must carry the tag's version; by hand any version passes.
          expected=
          if [ "$GITHUB_REF_TYPE" = tag ]; then expected=${GITHUB_REF_NAME#v}; fi
          build/smoke.sh '${{ steps.package.outputs.folder }}' $expected

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tacit-${{ steps.package.outputs.version }}-${{ matrix.runtime }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

  # Only once every package has passed its smoke test, so a Release never holds some platforms and not others.
  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # The build provenance attestation signs with the workflow's OIDC identity and stores the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tacit-*
          merge-multiple: true
          path: packages

      # Lets anyone check that a package was built by this workflow from this repository:
      # gh attestation verify <package> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packages/*.zip
            packages/*.tar.gz

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          version=${tag#v}
          arguments=("$tag" packages/* --title "$version" --verify-tag)
          # A version's notes are optional: .github/release-notes/<tag>.md when it exists, otherwise none.
          notes=.github/release-notes/$tag.md
          if [ -f "$notes" ]; then arguments+=(--notes-file "$notes"); else arguments+=(--notes ''); fi
          if [[ $version == *-* ]]; then arguments+=(--prerelease); fi
          gh release create "${arguments[@]}"
