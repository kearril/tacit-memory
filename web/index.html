<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // The colour scheme and palette the person picked, applied before the first paint; the interface keeps them
      // afterwards. Kept as small as can be: without storage the page simply follows the system.
      try {
        const scheme = localStorage.getItem("tacit.colorScheme");
        if (scheme === "light" || scheme === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = scheme;
        }
        const palette = localStorage.getItem("tacit.palette");
        if (palette) {
          document.documentElement.dataset.palette = palette;
        }
      } catch {}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TacitMemory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
